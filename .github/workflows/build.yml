name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            package: VaultApp-windows-x64
          - os: ubuntu-22.04
            package: VaultApp-linux-x64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Linux GUI libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Build executable
        run: >
          python -m PyInstaller --noconfirm --clean --onefile --windowed
          --name VaultApp --collect-all tkinterdnd2 vault_app.py

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force package | Out-Null
          Copy-Item dist/VaultApp.exe package/
          Copy-Item README.md package/
          Compress-Archive -Path package/* -DestinationPath "${{ matrix.package }}.zip"

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p package
          cp dist/VaultApp package/
          cp README.md package/
          chmod +x package/VaultApp
          tar -czf "${{ matrix.package }}.tar.gz" -C package .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.package }}
          path: |
            ${{ matrix.package }}.zip
            ${{ matrix.package }}.tar.gz
          if-no-files-found: error

  publish:
    name: Publish Release
    needs: build
    if: >-
      github.event_name == 'push' &&
      (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest

    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create or update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'Latest Build' }}
          body: |
            由 GitHub Actions 自动构建并发布。

            - 提交：`${{ github.sha }}`
            - 构建记录：${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            | 平台 | 文件 |
            | --- | --- |
            | Windows x64 | VaultApp-windows-x64.zip |
            | Linux x64 | VaultApp-linux-x64.tar.gz |
          files: artifacts/*
          make_latest: true
