name: Build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            package: VaultApp-windows-x64.exe
          - os: ubuntu-22.04
            package: VaultApp-linux-x64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Linux GUI libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Build executable
        run: >
          python -m PyInstaller --noconfirm --clean --onefile --windowed
          --name VaultApp --collect-all tkinterdnd2 vault_app.py

      - name: Prepare artifact (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Copy-Item dist/VaultApp.exe "${{ matrix.package }}"

      - name: Prepare artifact (Linux)
        if: runner.os == 'Linux'
        run: |
          cp dist/VaultApp "${{ matrix.package }}"
          chmod +x "${{ matrix.package }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.package }}
          path: ${{ matrix.package }}
          if-no-files-found: error

  publish:
    name: Publish Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Remove stale release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          repo="${{ github.repository }}"
          tag="${{ github.ref_name }}"
          ids=$(curl -sS -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/$repo/releases/tags/$tag" \
            | jq -r '.assets[]?.id')
          for id in $ids; do
            curl -sS -X DELETE -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/$repo/releases/assets/$id"
          done

      - name: Create or update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: |
            由 GitHub Actions 自动构建并发布。

            - 提交：`${{ github.sha }}`
            - 构建记录：${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            | 平台 | 文件 |
            | --- | --- |
            | Windows x64 | VaultApp-windows-x64.exe |
            | Linux x64 | VaultApp-linux-x64 |

            Linux 版本下载后执行 `chmod +x VaultApp-linux-x64` 即可运行。
          files: artifacts/*
          make_latest: true
